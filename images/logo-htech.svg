<svg xmlns="http://www.w3.org/2000/svg" width="275" height="66" viewBox="0 0 275 66">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020d1a"/>
      <stop offset="100%" style="stop-color:#020d1a"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0055ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#00aaff"/>
      <stop offset="100%" style="stop-color:#0044cc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="275" height="66" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="0.5" fill="none">
    <line x1="0"   y1="22" x2="275" y2="22"/>
    <line x1="0"   y1="44" x2="275" y2="44"/>
    <line x1="55"  y1="0"  x2="55"  y2="66"/>
    <line x1="110" y1="0"  x2="110" y2="66"/>
    <line x1="165" y1="0"  x2="165" y2="66"/>
    <line x1="220" y1="0"  x2="220" y2="66"/>
  </g>

  <!-- Circuit traces left -->
  <g stroke="#00d4ff" stroke-width="0.8" fill="none" opacity="0.3">
    <polyline points="4,28 12,28 12,14 20,14"/>
    <polyline points="4,28 4,42 12,42 12,36 20,36"/>
    <polyline points="20,14 20,8 28,8"/>
    <polyline points="20,36 20,46 28,46"/>
  </g>
  <g fill="#00d4ff" opacity="0.55" filter="url(#glow)">
    <circle cx="4"  cy="28" r="1.5"/>
    <circle cx="12" cy="14" r="1.5"/>
    <circle cx="12" cy="42" r="1.5"/>
    <circle cx="20" cy="8"  r="1.5"/>
    <circle cx="20" cy="46" r="1.5"/>
  </g>

  <!-- Server rack icon (smaller, 40px tall) -->
  <g transform="translate(38, 5)" filter="url(#glow)">
    <rect x="0" y="0" width="32" height="42" rx="2" fill="none" stroke="#00d4ff" stroke-width="1.4"/>
    <!-- Rack ears -->
    <rect x="-3" y="2"  width="3" height="4" rx="1" fill="#00aaff" opacity="0.4"/>
    <rect x="-3" y="36" width="3" height="4" rx="1" fill="#00aaff" opacity="0.4"/>
    <rect x="32" y="2"  width="3" height="4" rx="1" fill="#00aaff" opacity="0.4"/>
    <rect x="32" y="36" width="3" height="4" rx="1" fill="#00aaff" opacity="0.4"/>
    <!-- 1U servers -->
    <rect x="3" y="3"  width="26" height="6" rx="1.2" fill="url(#rackGrad)" opacity="0.85"/>
    <rect x="3" y="12" width="26" height="6" rx="1.2" fill="url(#rackGrad)" opacity="0.7"/>
    <rect x="3" y="21" width="26" height="6" rx="1.2" fill="url(#rackGrad)" opacity="0.55"/>
    <rect x="3" y="30" width="26" height="6" rx="1.2" fill="#003388" opacity="0.6"/>
    <rect x="3" y="37" width="26" height="3" rx="1"   fill="#001144" opacity="0.5"/>
    <!-- LEDs -->
    <circle cx="25" cy="6"  r="1.8" fill="#00ff88" filter="url(#glow)" opacity="0.9"/>
    <circle cx="25" cy="15" r="1.8" fill="#00ff88" filter="url(#glow)" opacity="0.8"/>
    <circle cx="25" cy="24" r="1.8" fill="#ffcc00" filter="url(#glow)" opacity="0.85"/>
    <circle cx="25" cy="33" r="1.8" fill="#00ff88" filter="url(#glow)" opacity="0.8"/>
    <!-- Drive bays -->
    <rect x="4" y="5"  width="17" height="2" rx="0.5" fill="#002255" opacity="0.8"/>
    <rect x="4" y="14" width="17" height="2" rx="0.5" fill="#002255" opacity="0.8"/>
    <rect x="4" y="23" width="17" height="2" rx="0.5" fill="#002255" opacity="0.8"/>
  </g>

  <!-- Vertical separator -->
  <line x1="85" y1="4" x2="85" y2="48" stroke="#00d4ff" stroke-width="0.8" opacity="0.45"/>
  <circle cx="85" cy="4"  r="1.5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="85" cy="48" r="1.5" fill="#00d4ff" opacity="0.6"/>

  <!-- DCIM text (vertically centered in top portion) -->
  <text x="95" y="36"
    font-family="'Arial Black','Arial',sans-serif"
    font-size="30"
    font-weight="900"
    letter-spacing="2"
    fill="#00d4ff"
    filter="url(#softGlow)">DCIM</text>

  <!-- Horizontal divider above subtitle -->
  <rect x="4" y="50" width="267" height="0.8" fill="url(#accentLine)" opacity="0.5"/>

  <!-- Subtitle at very bottom, below rack -->
  <text x="6" y="61"
    font-family="'Arial','sans-serif'"
    font-size="7"
    letter-spacing="0.5"
    fill="#5bbfdb"
    opacity="0.85">DATA CENTER INFRASTRUCTURE MANAGEMENT</text>
</svg>
