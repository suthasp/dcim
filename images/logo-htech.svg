<svg xmlns="http://www.w3.org/2000/svg" width="260" height="66" viewBox="0 0 260 66">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#041e36;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="260" height="66" fill="url(#bgGrad)"/>

  <!-- Circuit grid dots -->
  <g opacity="0.15" fill="#00d4ff">
    <circle cx="10" cy="10" r="1"/><circle cx="30" cy="10" r="1"/><circle cx="50" cy="10" r="1"/>
    <circle cx="10" cy="30" r="1"/><circle cx="30" cy="30" r="1"/><circle cx="50" cy="30" r="1"/>
    <circle cx="10" cy="50" r="1"/><circle cx="30" cy="50" r="1"/><circle cx="50" cy="50" r="1"/>
    <circle cx="20" cy="20" r="1"/><circle cx="40" cy="20" r="1"/>
    <circle cx="20" cy="40" r="1"/><circle cx="40" cy="40" r="1"/>
    <circle cx="20" cy="60" r="1"/><circle cx="40" cy="60" r="1"/>
  </g>

  <!-- Circuit lines -->
  <g stroke="#00d4ff" stroke-width="0.5" opacity="0.2" fill="none">
    <line x1="10" y1="10" x2="30" y2="10"/>
    <line x1="30" y1="10" x2="30" y2="30"/>
    <line x1="10" y1="30" x2="20" y2="30"/>
    <line x1="20" y1="30" x2="20" y2="50"/>
    <line x1="20" y1="50" x2="50" y2="50"/>
    <line x1="50" y1="10" x2="50" y2="30"/>
    <line x1="40" y1="20" x2="50" y2="20"/>
    <line x1="10" y1="50" x2="10" y2="60"/>
    <line x1="40" y1="40" x2="40" y2="60"/>
  </g>

  <!-- Server rack icon -->
  <g transform="translate(62, 8)" filter="url(#glow)">
    <!-- Rack frame -->
    <rect x="0" y="0" width="28" height="50" rx="2" fill="none" stroke="#00d4ff" stroke-width="1.2"/>
    <!-- Rack units -->
    <rect x="3" y="4"  width="22" height="6" rx="1" fill="#00d4ff" opacity="0.7"/>
    <rect x="3" y="13" width="22" height="6" rx="1" fill="#00d4ff" opacity="0.5"/>
    <rect x="3" y="22" width="22" height="6" rx="1" fill="#00d4ff" opacity="0.4"/>
    <rect x="3" y="31" width="22" height="6" rx="1" fill="#0066ff" opacity="0.5"/>
    <rect x="3" y="40" width="22" height="6" rx="1" fill="#0066ff" opacity="0.4"/>
    <!-- LED indicators -->
    <circle cx="21" cy="7"  r="1.5" fill="#00ff88" opacity="0.9"/>
    <circle cx="21" cy="16" r="1.5" fill="#00ff88" opacity="0.7"/>
    <circle cx="21" cy="25" r="1.5" fill="#ffaa00" opacity="0.8"/>
    <circle cx="21" cy="34" r="1.5" fill="#00ff88" opacity="0.7"/>
    <circle cx="21" cy="43" r="1.5" fill="#00ff88" opacity="0.6"/>
  </g>

  <!-- Divider line -->
  <line x1="100" y1="8" x2="100" y2="58" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>

  <!-- openDCIM text -->
  <text x="110" y="30"
    font-family="'Arial', sans-serif"
    font-size="22"
    font-weight="bold"
    letter-spacing="1"
    fill="#ffffff"
    filter="url(#textGlow)">open<tspan fill="#00d4ff">DCIM</tspan></text>

  <!-- Subtitle -->
  <text x="110" y="46"
    font-family="'Arial', sans-serif"
    font-size="8"
    letter-spacing="0.5"
    fill="#7ecfed"
    opacity="0.85">data center infrastructure management</text>

  <!-- Bottom accent line -->
  <rect x="110" y="50" width="140" height="1" fill="url(#lineGrad)" opacity="0.6"/>

  <!-- Top accent line -->
  <rect x="110" y="14" width="140" height="0.5" fill="url(#lineGrad)" opacity="0.3"/>
</svg>
